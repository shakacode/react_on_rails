# Generated by shaka seam init.
# Shaka repository contract. Validate with: shaka seam check --root .
---
version: 1
base_branch: main
review:
  required: meaningful_changes
  check: claude-review
  reviewers:
    - provider: anthropic
      model_family: claude
    - provider: openai
      model_family: codex
    - provider: xai
      model_family: grok
merge:
  preference: ask
branches:
  name: '{login}-{host}/{issue}-{description}'
