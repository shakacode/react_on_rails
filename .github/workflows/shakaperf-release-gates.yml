---
name: ShakaPerf Release Gates
run-name: >-
  ShakaPerf Release Gates — ${{ inputs.target_version }} on
  ${{ github.ref_name }} @ ${{ inputs.candidate_sha }}

permissions:
  contents: read

"on":
  workflow_dispatch:
    inputs:
      target_version:
        description: RubyGems-format release version being tested
        required: true
        type: string
      candidate_sha:
        description: Exact release-branch commit being tested
        required: true
        type: string

concurrency:
  group: shakaperf-release-gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: >-
      Validate ${{ inputs.target_version }} on ${{ github.ref_name }} @
      ${{ inputs.candidate_sha }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      runtime_tree_fingerprint: >-
        ${{ steps.candidate.outputs.runtime_tree_fingerprint }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read runtime versions
        id: tool-versions
        uses: ./.github/actions/read-tool-versions

      - name: Setup Ruby
        uses: ./.github/actions/setup-ruby
        with:
          ruby-version: ${{ steps.tool-versions.outputs.minimum-ruby-version }}
          bundler-version: 2.5.4

      - name: Validate exact candidate
        id: candidate
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          ruby -rrake <<'RUBY'
          load "rakelib/release.rake"

          candidate_sha = ENV.fetch("CANDIDATE_SHA")
          current_sha = current_git_sha!(
            Dir.pwd,
            context: "validating ShakaPerf candidate"
          )
          abort "Candidate SHA #{candidate_sha} no longer matches " \
                "workflow HEAD #{current_sha}." \
            unless candidate_sha == current_sha

          target_version = ENV.fetch("TARGET_VERSION")
          validate_requested_version_input!(target_version)
          ensure_release_branch_matches_target_base!(
            current_branch: ENV.fetch("RELEASE_BRANCH"),
            target_gem_version: target_version
          )

          current_version = current_gem_version(Dir.pwd)
          prepared_candidate = shakaperf_prerun_candidate(
            monorepo_root: Dir.pwd,
            ref: ENV.fetch("RELEASE_BRANCH"),
            head_sha: candidate_sha
          )
          prepared_version = prepared_candidate&.fetch(:target_version)
          unless target_version == current_version ||
                 target_version == prepared_version
            abort "Target version #{target_version} is neither " \
                  "the checked-in version #{current_version} nor " \
                  "the prepared changelog version " \
                  "#{prepared_version || 'none'}."
          end

          fingerprint = shakaperf_runtime_tree_fingerprint(
            monorepo_root: Dir.pwd,
            sha: candidate_sha
          )
          abort "Unable to fingerprint ShakaPerf candidate " \
                "#{candidate_sha}." \
            unless fingerprint

          File.open(ENV.fetch("GITHUB_OUTPUT"), "a") do |output|
            output.puts "runtime_tree_fingerprint=#{fingerprint}"
          end
          File.open(ENV.fetch("GITHUB_STEP_SUMMARY"), "a") do |summary|
            summary.puts(
              "Testing #{target_version} on " \
              "#{ENV.fetch('RELEASE_BRANCH')} at #{candidate_sha}."
            )
            summary.puts "Runtime tree fingerprint: `#{fingerprint}`"
          end
          RUBY

  rsc-fouc:
    name: >-
      RSC FOUC gate for ${{ inputs.target_version }} @
      ${{ inputs.candidate_sha }}
    needs: candidate
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      RAILS_ENV: test
      NODE_ENV: test
      # Dummy value for RAILS_ENV=test; no real credentials are encrypted or
      # persisted.
      # yamllint disable-line rule:line-length
      SECRET_KEY_BASE: dummy-secret-key-base-for-shakaperf-rsc-fouc  # gitleaks:allow
      SHAKAPERF_CONTROL_URL: http://127.0.0.1:3000
      SHAKAPERF_EXPERIMENT_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Read runtime versions
        id: tool-versions
        uses: ./.github/actions/read-tool-versions

      - name: Check Pro license secret
        env:
          REACT_ON_RAILS_PRO_LICENSE: >-
            ${{ secrets.REACT_ON_RAILS_PRO_LICENSE_V2 }}
        run: |
          if [[ -z "${REACT_ON_RAILS_PRO_LICENSE}" ]]; then
            echo \
              "::error::REACT_ON_RAILS_PRO_LICENSE_V2 secret is not set;" \
              "cannot run the Pro dummy app ShakaPerf gate"
            exit 1
          fi

      - name: Setup Ruby
        uses: ./.github/actions/setup-ruby
        with:
          ruby-version: ${{ steps.tool-versions.outputs.minimum-ruby-version }}
          bundler-version: 2.5.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Latest Node comes from .tool-versions; pinned below the Node startup
          # regression.
          # https://github.com/nodejs/node/issues/56010
          node-version-file: .tool-versions

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Print system information
        run: |
          echo "Linux release: "; cat /etc/issue
          echo "Current user: "; whoami
          echo "Current directory: "; pwd
          echo "Ruby version: "; ruby -v
          echo "Node version: "; node -v
          echo "pnpm version: "; pnpm --version
          echo "Bundler version: "; bundle --version

      - name: Install Node modules with pnpm
        run: pnpm install --frozen-lockfile

      - name: Install Ruby Gems for Pro package
        uses: ./.github/actions/setup-bundle
        with:
          working-directory: react_on_rails_pro
          ruby-version: ${{ steps.tool-versions.outputs.minimum-ruby-version }}
          install-libyaml: 'false'

      - name: Install Ruby Gems for Pro dummy app
        uses: ./.github/actions/setup-bundle
        with:
          working-directory: react_on_rails_pro/spec/dummy
          ruby-version: ${{ steps.tool-versions.outputs.minimum-ruby-version }}
          install-libyaml: 'false'

      - name: Build Pro JavaScript packages
        run: |
          pnpm --filter react-on-rails run build
          pnpm --filter react-on-rails-pro run build
          pnpm --filter react-on-rails-pro-node-renderer run build

      - name: Prepare Pro dummy app
        working-directory: react_on_rails_pro/spec/dummy
        env:
          REACT_ON_RAILS_PRO_LICENSE: >-
            ${{ secrets.REACT_ON_RAILS_PRO_LICENSE_V2 }}
        run: |
          bundle exec rake react_on_rails:generate_packs
          pnpm run build:test
          bundle exec rails db:prepare

      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium
        working-directory: react_on_rails_pro/spec/dummy
        run: pnpm exec playwright install --with-deps chromium

      - name: Start Pro dummy app
        shell: bash
        env:
          REACT_ON_RAILS_PRO_LICENSE: >-
            ${{ secrets.REACT_ON_RAILS_PRO_LICENSE_V2 }}
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/shakaperf-logs"

          cd react_on_rails_pro/spec/dummy
          RENDERER_PORT=3800 \
            pnpm run node-renderer \
            > "$RUNNER_TEMP/shakaperf-logs/node-renderer.log" 2>&1 &
          node_renderer_pid="$!"
          echo "$node_renderer_pid" > "$RUNNER_TEMP/shakaperf-node-renderer.pid"

          # RSCPostsPageOverHTTP fetches http://localhost:3000/api/... inside
          # the node renderer.
          PORT=3000 \
            REACT_RENDERER_URL=http://127.0.0.1:3800 \
            bundle exec rails s -b 127.0.0.1 -p 3000 \
            > "$RUNNER_TEMP/shakaperf-logs/rails.log" 2>&1 &
          rails_pid="$!"
          echo "$rails_pid" > "$RUNNER_TEMP/shakaperf-rails.pid"

          probe_renderer_info() {
            node <<'NODE'
          const http2 = require('node:http2');

          const client = http2.connect('http://127.0.0.1:3800');
          let status;
          let timeout;
          let completed = false;

          const finish = (exitCode, destroyClient = false) => {
            if (completed) return;
            completed = true;
            clearTimeout(timeout);
            if (destroyClient) {
              client.destroy();
            } else {
              client.close();
            }
            process.exit(exitCode);
          };

          const fail = () => finish(1, true);

          client.on('error', fail);
          const request = client.request({
            ':method': 'GET',
            ':path': '/info',
          });
          request.on('error', fail);
          request.on('response', (headers) => {
            status = headers[':status'];
          });
          request.on('data', () => {});
          request.on('end', () => {
            finish(status >= 200 && status < 300 ? 0 : 1);
          });
          request.end();
          timeout = setTimeout(fail, 5000);
          NODE
          }

          for attempt in {1..60}; do
            echo "Waiting for RSC FOUC probe server (${attempt}/60)..."
            # /info proves the renderer socket responds, /empty proves Rails
            # responds,
            # and the RSC page proves both sides are warm enough for the gate.
            if probe_renderer_info &&
              curl --connect-timeout 2 --max-time 5 -fsS \
                "$SHAKAPERF_CONTROL_URL/empty" > /dev/null &&
              curl --connect-timeout 2 --max-time 5 -fsS \
                "$SHAKAPERF_CONTROL_URL/rsc_posts_page_over_http" \
                > /dev/null
            then
              # All probes are up; exit this step and leave the background
              # servers running for ShakaPerf.
              exit 0
            fi

            if ! kill -0 "$node_renderer_pid" 2>/dev/null; then
              echo "::error::Node renderer died before becoming ready"
              tail -n 100 \
                "$RUNNER_TEMP/shakaperf-logs/node-renderer.log" || true
              exit 1
            fi

            if ! kill -0 "$rails_pid" 2>/dev/null; then
              echo "::error::Rails server died before becoming ready"
              tail -n 100 "$RUNNER_TEMP/shakaperf-logs/rails.log" || true
              exit 1
            fi

            sleep 2
          done

          echo \
            "::error::Timed out waiting for renderer /info," \
            "$SHAKAPERF_CONTROL_URL/empty, and" \
            "/rsc_posts_page_over_http"
          tail -n 200 "$RUNNER_TEMP/shakaperf-logs/node-renderer.log" || true
          tail -n 200 "$RUNNER_TEMP/shakaperf-logs/rails.log" || true
          exit 1

      - name: Run RSC FOUC ShakaPerf gate
        run: |
          # This release gate compares the candidate app with itself. The
          # assertions in the abtest are absolute, so they fail even when both
          # sides are broken.
          filter_path="test/shakaperf/rsc-fouc/ab-tests"
          filter_path+="/rsc-fouc-release-gate.abtest.ts"
          pnpm exec shaka-perf compare \
            --categories visreg \
            --config test/shakaperf/rsc-fouc/abtests.config.ts \
            --filter "$filter_path" \
            --controlURL "$SHAKAPERF_CONTROL_URL" \
            --experimentURL "$SHAKAPERF_EXPERIMENT_URL" \
            --full-report-zip

      - name: Upload ShakaPerf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsc-fouc-shakaperf-report
          path: compare-results/
          retention-days: 30

      - name: Upload ShakaPerf server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rsc-fouc-shakaperf-server-logs
          path: ${{ runner.temp }}/shakaperf-logs/
          retention-days: 30

      - name: Stop Pro dummy app
        if: always()
        shell: bash
        run: |
          for pidfile in \
            "$RUNNER_TEMP/shakaperf-rails.pid" \
            "$RUNNER_TEMP/shakaperf-node-renderer.pid"; do
            if [ -f "$pidfile" ]; then
              kill "$(cat "$pidfile")" 2>/dev/null || true
            fi
          done

  # PPR A/B benchmark gate (issue #5103): warm-hit TTFB and LCP vs streaming
  # SSR, on the dedicated M1 benchmark box from #4073 — the repo's first
  # self-hosted job. Self-hosted safety (#4073): this workflow runs only on
  # workflow_dispatch, never on pull_request, so only maintainer-dispatched,
  # already-merged code reaches the runner.
  ppr:
    name: >-
      PPR A/B benchmark gate for ${{ inputs.target_version }} @
      ${{ inputs.candidate_sha }}
    needs: candidate
    # Forks have no rork-bench runner; without this guard a dispatched run
    # would queue forever.
    if: github.repository == 'shakacode/react_on_rails'
    runs-on: [self-hosted, macOS, ARM64, rork-bench]
    # ADVISORY (issue #5103, lesson of #3169): a new benchmark gate must not
    # block releases on day one. continue-on-error keeps the workflow-run
    # conclusion green when this job fails — rakelib/release.rake requires
    # conclusion == success and validates an exact evidence key set, so the
    # release tooling is unaffected. Promote to blocking only after three
    # consecutive green runs on this runner: flip this flag and fold the job
    # result into the evidence JSON + release.rake key list in the same PR.
    continue-on-error: true
    timeout-minutes: 60
    env:
      RAILS_ENV: test
      NODE_ENV: test
      # Dummy value for RAILS_ENV=test; no real credentials are encrypted or
      # persisted.
      SECRET_KEY_BASE: dummy-secret-key-base-for-shakaperf-ppr  # gitleaks:allow
      SHAKAPERF_CONTROL_URL: http://127.0.0.1:3000
      SHAKAPERF_EXPERIMENT_URL: http://127.0.0.1:3000
      # Warm-hit PPR needs a real cache store (test.rb opts into
      # :memory_store on this flag) and single-mode Puma — the per-process
      # memory store and the per-process ppr.cache.lookup ring both break
      # under clustered workers.
      SHAKAPERF_PPR_CACHE: 'true'
      WEB_CONCURRENCY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Read runtime versions
        id: tool-versions
        uses: ./.github/actions/read-tool-versions

      - name: Check Pro license secret
        env:
          REACT_ON_RAILS_PRO_LICENSE: >-
            ${{ secrets.REACT_ON_RAILS_PRO_LICENSE_V2 }}
        run: |
          if [[ -z "${REACT_ON_RAILS_PRO_LICENSE}" ]]; then
            echo \
              "::error::REACT_ON_RAILS_PRO_LICENSE_V2 secret is not set;" \
              "cannot run the Pro dummy app ShakaPerf gate"
            exit 1
          fi

      - name: Check benchmark ports are free
        shell: bash
        run: |
          # The benchmark box is a persistent machine: a leftover server from
          # an earlier run would silently serve stale code to this gate.
          for port in 3000 3800; do
            if lsof -nP -iTCP:"$port" -sTCP:LISTEN; then
              echo \
                "::error::Port $port is already in use on the benchmark" \
                "runner — a previous run left a server behind. Kill it" \
                "before re-dispatching."
              exit 1
            fi
          done

      - name: Setup Ruby
        uses: ./.github/actions/setup-ruby
        with:
          ruby-version: ${{ steps.tool-versions.outputs.minimum-ruby-version }}
          bundler-version: 2.5.4
          install-libyaml: 'false'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Print system information
        run: |
          echo "macOS release: "; sw_vers
          echo "Hardware: "; sysctl -n machdep.cpu.brand_string hw.memsize
          echo "Current user: "; whoami
          echo "Current directory: "; pwd
          echo "Ruby version: "; ruby -v
          echo "Node version: "; node -v
          echo "pnpm version: "; pnpm --version
          echo "Bundler version: "; bundle --version

      - name: Install Node modules with pnpm
        run: pnpm install --frozen-lockfile

      - name: Install Ruby Gems for Pro package
        uses: ./.github/actions/setup-bundle
        with:
          working-directory: react_on_rails_pro
          ruby-version: ${{ steps.tool-versions.outputs.minimum-ruby-version }}
          install-libyaml: 'false'

      - name: Install Ruby Gems for Pro dummy app
        uses: ./.github/actions/setup-bundle
        with:
          working-directory: react_on_rails_pro/spec/dummy
          ruby-version: ${{ steps.tool-versions.outputs.minimum-ruby-version }}
          install-libyaml: 'false'

      - name: Build Pro JavaScript packages
        run: |
          pnpm --filter react-on-rails run build
          pnpm --filter react-on-rails-pro run build
          pnpm --filter react-on-rails-pro-node-renderer run build

      - name: Prepare Pro dummy app
        working-directory: react_on_rails_pro/spec/dummy
        env:
          REACT_ON_RAILS_PRO_LICENSE: >-
            ${{ secrets.REACT_ON_RAILS_PRO_LICENSE_V2 }}
        run: |
          bundle exec rake react_on_rails:generate_packs
          pnpm run build:test
          bundle exec rails db:prepare

      - name: Install Playwright Chromium
        # Idempotent; the persistent runner keeps the browser between runs,
        # so no actions/cache step (the Linux cache path does not exist on
        # macOS anyway).
        working-directory: react_on_rails_pro/spec/dummy
        run: pnpm exec playwright install chromium

      - name: Start Pro dummy app in PPR mode
        shell: bash
        env:
          REACT_ON_RAILS_PRO_LICENSE: >-
            ${{ secrets.REACT_ON_RAILS_PRO_LICENSE_V2 }}
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/ppr-shakaperf-logs"

          cd react_on_rails_pro/spec/dummy
          RENDERER_PORT=3800 \
            pnpm run node-renderer \
            > "$RUNNER_TEMP/ppr-shakaperf-logs/node-renderer.log" 2>&1 &
          node_renderer_pid="$!"
          echo "$node_renderer_pid" \
            > "$RUNNER_TEMP/ppr-shakaperf-node-renderer.pid"

          PORT=3000 \
            REACT_RENDERER_URL=http://127.0.0.1:3800 \
            bundle exec rails s -b 127.0.0.1 -p 3000 \
            > "$RUNNER_TEMP/ppr-shakaperf-logs/rails.log" 2>&1 &
          rails_pid="$!"
          echo "$rails_pid" > "$RUNNER_TEMP/ppr-shakaperf-rails.pid"

          probe_renderer_info() {
            node <<'NODE'
          const http2 = require('node:http2');

          const client = http2.connect('http://127.0.0.1:3800');
          let status;
          let timeout;
          let completed = false;

          const finish = (exitCode, destroyClient = false) => {
            if (completed) return;
            completed = true;
            clearTimeout(timeout);
            if (destroyClient) {
              client.destroy();
            } else {
              client.close();
            }
            process.exit(exitCode);
          };

          const fail = () => finish(1, true);

          client.on('error', fail);
          const request = client.request({
            ':method': 'GET',
            ':path': '/info',
          });
          request.on('error', fail);
          request.on('response', (headers) => {
            status = headers[':status'];
          });
          request.on('data', () => {});
          request.on('end', () => {
            finish(status >= 200 && status < 300 ? 0 : 1);
          });
          request.end();
          timeout = setTimeout(fail, 5000);
          NODE
          }

          ppr_probe_path="/ppr_page_for_testing"
          ppr_probe_path+="?cacheKey=shakaperf-ppr-ci-probe&holeDelayMs=1000"
          for attempt in {1..60}; do
            echo "Waiting for PPR gate servers (${attempt}/60)..."
            # /info proves the renderer responds; /empty proves Rails
            # responds; the PPR route proves the prerender/resume path works
            # end to end; /shakaperf_ppr_lookups proves the app booted with
            # the lookup recorder mounted (SHAKAPERF_PPR_CACHE=true), so the
            # gate cannot silently measure an app without warm-hit proof;
            # the streaming route proves the control side.
            if probe_renderer_info &&
              curl --connect-timeout 2 --max-time 5 -fsS \
                "$SHAKAPERF_CONTROL_URL/empty" > /dev/null &&
              curl --connect-timeout 2 --max-time 30 -fsS \
                "$SHAKAPERF_CONTROL_URL$ppr_probe_path" > /dev/null &&
              curl --connect-timeout 2 --max-time 5 -fsS \
                "$SHAKAPERF_CONTROL_URL/shakaperf_ppr_lookups" \
                > /dev/null &&
              curl --connect-timeout 2 --max-time 30 -fsS \
                "$SHAKAPERF_CONTROL_URL/stream_async_components_for_testing" \
                > /dev/null
            then
              exit 0
            fi

            if ! kill -0 "$node_renderer_pid" 2>/dev/null; then
              echo "::error::Node renderer died before becoming ready"
              tail -n 100 \
                "$RUNNER_TEMP/ppr-shakaperf-logs/node-renderer.log" || true
              exit 1
            fi

            if ! kill -0 "$rails_pid" 2>/dev/null; then
              echo "::error::Rails server died before becoming ready"
              tail -n 100 "$RUNNER_TEMP/ppr-shakaperf-logs/rails.log" || true
              exit 1
            fi

            sleep 2
          done

          echo \
            "::error::Timed out waiting for renderer /info, /empty," \
            "the PPR route, /shakaperf_ppr_lookups, and the streaming route"
          tail -n 200 \
            "$RUNNER_TEMP/ppr-shakaperf-logs/node-renderer.log" || true
          tail -n 200 "$RUNNER_TEMP/ppr-shakaperf-logs/rails.log" || true
          exit 1

      - name: Run PPR ShakaPerf gate
        id: gate
        run: |
          # True A/B: control and experiment are DIFFERENT ROUTES on the SAME
          # server (#3255 Decision 5). The warm-hit guard additionally runs
          # both sides against the PPR route with absolute assertions,
          # including per-sample ppr.cache.lookup outcome == hit.
          filter_path="test/shakaperf/ppr/ab-tests"
          filter_path+="/ppr-release-gate.abtest.ts"
          pnpm exec shaka-perf compare \
            --categories perf \
            --config test/shakaperf/ppr/abtests.config.ts \
            --filter "$filter_path" \
            --controlURL "$SHAKAPERF_CONTROL_URL" \
            --experimentURL "$SHAKAPERF_EXPERIMENT_URL" \
            --full-report-zip

      - name: Record advisory gate outcome
        if: always()
        env:
          GATE_OUTCOME: ${{ steps.gate.outcome }}
        run: |
          {
            echo "## PPR A/B benchmark gate (advisory)"
            echo ""
            echo "Outcome: **${GATE_OUTCOME}**"
            echo ""
            echo "Not blocking yet (#5103: three consecutive green runs" \
              "before promotion; #3169). TTFB/LCP rows and the plan §6" \
              "ratio: see the ppr-shakaperf-report artifact."
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$GATE_OUTCOME" != "success" ]; then
            echo "::warning::PPR benchmark gate outcome: $GATE_OUTCOME" \
              "(advisory — not blocking this release run)"
          fi

      - name: Upload ShakaPerf report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppr-shakaperf-report
          path: compare-results/
          retention-days: 30

      - name: Upload ShakaPerf server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ppr-shakaperf-server-logs
          path: ${{ runner.temp }}/ppr-shakaperf-logs/
          retention-days: 30

      - name: Stop Pro dummy app
        if: always()
        shell: bash
        run: |
          for pidfile in \
            "$RUNNER_TEMP/ppr-shakaperf-rails.pid" \
            "$RUNNER_TEMP/ppr-shakaperf-node-renderer.pid"; do
            if [ -f "$pidfile" ]; then
              kill "$(cat "$pidfile")" 2>/dev/null || true
              rm -f "$pidfile"
            fi
          done

  evidence:
    name: Record gate evidence
    # The ppr job is deliberately absent here: it is advisory
    # (continue-on-error) until it has three consecutive green runs, and the
    # evidence key set is validated exactly by rakelib/release.rake — fold
    # the ppr result in only when promoting it to a blocking gate.
    if: always() && needs.candidate.result == 'success'
    needs:
      - candidate
      - rsc-fouc
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Create machine-readable evidence
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          CONCLUSION: ${{ needs.rsc-fouc.result }}
          RELEASE_BRANCH: ${{ github.ref_name }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          RUNTIME_TREE_FINGERPRINT: >-
            ${{ needs.candidate.outputs.runtime_tree_fingerprint }}
          TARGET_VERSION: ${{ inputs.target_version }}
        run: |
          ruby -rjson -rtime <<'RUBY'
          evidence = {
            schema_version: 2,
            run_attempt: Integer(ENV.fetch("RUN_ATTEMPT"), 10),
            run_id: Integer(ENV.fetch("RUN_ID"), 10),
            run_url: "https://github.com/" \
                     "#{ENV.fetch('GITHUB_REPOSITORY')}/actions/runs/" \
                     "#{ENV.fetch('RUN_ID')}",
            branch: ENV.fetch("RELEASE_BRANCH"),
            candidate_sha: ENV.fetch("CANDIDATE_SHA"),
            target_version: ENV.fetch("TARGET_VERSION"),
            conclusion: ENV.fetch("CONCLUSION"),
            runtime_tree_fingerprint: ENV.fetch("RUNTIME_TREE_FINGERPRINT"),
            completed_at: Time.now.utc.iso8601
          }
          File.write(
            "shakaperf-release-evidence.json",
            "#{JSON.pretty_generate(evidence)}\n"
          )
          RUBY

      - name: Upload ShakaPerf release evidence
        uses: actions/upload-artifact@v4
        with:
          name: shakaperf-release-evidence
          path: shakaperf-release-evidence.json
          retention-days: 30
