name: ci-required

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:
  workflow_dispatch:
    inputs:
      pull_request_base_ref:
        description: PR base branch for hosted-label cleanup rechecks.
        required: false
        type: string
      pull_request_base_sha:
        description: PR base SHA for hosted-label cleanup rechecks.
        required: false
        type: string
      force_required_hosted_ci_recheck:
        description: Re-run the required gate after hosted-label cleanup with hosted CI treated as not requested.
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  checks: read
  contents: read
  issues: read

concurrency:
  group: >-
    ${{
      github.event_name == 'pull_request' &&
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name != 'ready-for-hosted-ci' &&
      github.event.label.name != 'force-full-hosted-ci' &&
      format('ci-required-ignored-label-{0}', github.run_id) ||
      format('ci-required-{0}', github.event.pull_request.number || github.ref)
    }}
  cancel-in-progress: >-
    ${{
      github.event_name != 'pull_request' ||
      (
        (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'ready-for-hosted-ci' ||
        github.event.label.name == 'force-full-hosted-ci'
      )
    }}

jobs:
  # Of the PR's labels, the gate reads only the two hosted-CI labels, but status
  # labels (awaiting-merge-approval, awaiting-resume, hold, ...) change often. A
  # skipped required job reports success and the newest check run of a name wins,
  # so the gate may skip only when the newest gate that ran on this head passed,
  # no gate run on it is in flight, and neither a hosted-CI label nor the base
  # branch changed since that gate was triggered. Neither change needs to fire a
  # gate event: the workflow token edits labels silently, and a retarget is an
  # `edited` event. Dependabot PRs always run: their gate also reads +ci-*
  # comments. Otherwise, or when this job fails, the full gate runs.
  label-event-filter:
    name: label-event-filter
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action == 'labeled' || github.event.action == 'unlabeled') &&
      github.event.label.name != 'ready-for-hosted-ci' &&
      github.event.label.name != 'force-full-hosted-ci'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_gate: ${{ steps.decide.outputs.run_gate }}
    steps:
      - name: Decide whether the required gate must rerun
        id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const hostedLabels = new Set(['ready-for-hosted-ci', 'force-full-hosted-ci']);
            const pullRequest = context.payload.pull_request;
            const headSha = pullRequest.head.sha;
            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: headSha,
              check_name: 'required-pr-gate',
              filter: 'all',
              per_page: 100
            });
            const gateRuns = checkRuns
              .filter((run) => run.app?.slug === 'github-actions')
              .sort((left, right) => right.id - left.id);
            // Earlier skips rest on the run behind them, so judge the newest gate that ran.
            const newestRan = gateRuns.find((run) => run.conclusion !== 'skipped');

            // The passing run's base comes from its triggering event, so measure from
            // when that workflow run was created, not when its gate job started.
            async function passingRunCreatedAt() {
              const workflowRuns = await github.paginate(github.rest.actions.listWorkflowRuns, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'ci-required.yml',
                head_sha: headSha,
                per_page: 100
              });
              return workflowRuns.find((run) => run.check_suite_id === newestRan.check_suite?.id)?.created_at;
            }

            async function gateInputChangedSince(since) {
              const events = await github.paginate(github.rest.issues.listEvents, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pullRequest.number,
                per_page: 100
              });
              return events.some(
                (event) =>
                  Date.parse(event.created_at) >= Date.parse(since) &&
                  (event.event === 'base_ref_changed' ||
                    ((event.event === 'labeled' || event.event === 'unlabeled') &&
                      hostedLabels.has(event.label?.name)))
              );
            }

            let reason = '';
            let since;
            if (pullRequest.user?.login === 'dependabot[bot]') {
              reason = 'Dependabot gates also read +ci-* comments';
            } else if (gateRuns.some((run) => run.status !== 'completed')) {
              reason = 'a gate run for this head is still in progress';
            } else if (!newestRan) {
              reason = 'no gate has run on this head';
            } else if (newestRan.conclusion !== 'success') {
              reason = `the newest gate result for this head is ${newestRan.conclusion}`;
            } else if (!(since = await passingRunCreatedAt())) {
              reason = 'the workflow run behind the newest passing gate was not found';
            } else if (await gateInputChangedSince(since)) {
              reason = 'a hosted-CI label or the base branch changed after the newest passing gate was triggered';
            }

            const runGate = reason !== '';
            core.setOutput('run_gate', String(runGate));
            core.info(
              runGate
                ? `Running the required gate: ${reason}.`
                : `Skipping the required gate: label ${context.payload.label?.name} is not read by the gate, and gate check run ` +
                    `${newestRan.id} already passed on ${headSha} with the current hosted-CI labels and base branch.`
            );

  required-pr-gate:
    name: required-pr-gate
    needs: label-event-filter
    # Run unless the filter succeeded and found a passing gate on this head.
    # A skipped or failed filter always runs the full gate.
    if: >-
      ${{
        !cancelled() &&
        !(needs.label-event-filter.result == 'success' && needs.label-event-filter.outputs.run_gate == 'false')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 50
          persist-credentials: false

      - name: Set up Ruby for Shaka
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1
        with:
          ruby-version: '3.4'

      - name: Check out pinned Shaka
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: shakacode/shaka
          ref: da95d68fd8215ae9f789a03a8c9588fb6ccf15c9
          path: .shaka-source
          fetch-depth: 1
          persist-credentials: false

      - name: Validate repository seam with Shaka
        run: |
          .shaka-source/skills/shaka/scripts/shaka seam check --root "$GITHUB_WORKSPACE" --local
          SHAKA_COMMAND=.shaka-source/skills/shaka/scripts/shaka ruby script/shaka_seam_check_test.rb

      - name: Validate workflow YAML
        run: |
          ruby -e "require 'yaml'; Dir['.github/workflows/*.{yml,yaml}'].sort.each { |f| YAML.safe_load_file(f, permitted_classes: [], aliases: false); puts f }"

      - name: Validate CI scripts
        run: |
          for script in \
            .agents/bin/lint \
            .agents/shaka/bin/setup \
            .agents/shaka/bin/validate \
            .agents/shaka/bin/test \
            bin/ci-local \
            bin/ci-rerun-failures \
            bin/request-hosted-ci \
            script/ci-changes-detector \
            script/ci-required-diff-base \
            script/ci-required-diff-base-test.bash \
            script/ci-required-hosted-gate
          do
            bash -n "$script"
          done
          ruby -c script/ci-required-merge-group-gate

      - name: Run CI gate tests
        run: |
          bash script/ci-required-hosted-gate-test.bash
          bash script/ci-required-diff-base-test.bash
          bash script/lint-mirrored-blocks-test.bash
          ruby script/ci_required_merge_group_gate_test.rb
          node --test .github/workflows/ci-commands.test.cjs
          node --test .github/workflows/ci-required-label-filter.test.cjs
          node .github/workflows/hosted-ci-safety.test.cjs
          ruby script/pr_merge_ledger_test.rb
          ruby .agents/skills/react-on-rails-update-changelog/bin/changelog-merged-prs-test.rb

      - name: Check mirrored blocks
        run: ruby bin/lint-mirrored-blocks

      - name: Fetch workflow dispatch base
        if: github.event_name == 'workflow_dispatch'
        env:
          BASE_REF: ${{ github.event.inputs.pull_request_base_ref || 'main' }}
        run: |
          git fetch --no-tags --depth=50 origin "${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Select hosted CI mode
        id: hosted-ci
        uses: ./.github/actions/hosted-ci-selectors
        with:
          base-ref: ${{ github.event.inputs.pull_request_base_ref || '' }}

      - name: Run changed-files detector
        id: changes
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.inputs.pull_request_base_sha || '' }}
          PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
          # Keep this expression on one line. It is the merge-queue base-ref
          # contract asserted by react_on_rails/spec/react_on_rails/ruby_version_support_spec.rb,
          # which matches the raw file text, and a folded scalar would preserve
          # the newlines rather than fold them (the continuation lines are more
          # indented than the first).
          EVENT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before || 'origin/main' }}
        run: script/ci-required-diff-base

      - name: Enforce hosted CI for generator changes
        env:
          RUN_GENERATORS: ${{ steps.changes.outputs.run_generators }}
          SHOULD_RUN_HOSTED_CI: >-
            ${{
              github.event_name == 'workflow_dispatch' &&
              github.event.inputs.force_required_hosted_ci_recheck == 'true' &&
              'false' ||
              steps.hosted-ci.outputs.should_run_hosted_ci
            }}
          FORCE_REQUIRED_HOSTED_CI_RECHECK: >-
            ${{
              github.event_name == 'workflow_dispatch' &&
              github.event.inputs.force_required_hosted_ci_recheck == 'true' &&
              'true' ||
              'false'
            }}
        run: |
          script/ci-required-hosted-gate

      - name: Enforce merge-group package JS minimum gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUIRE_PACKAGE_JS_BUILD_20: ${{ steps.changes.outputs.run_js_tests }}
        run: ruby script/ci-required-merge-group-gate

      - name: Lightweight repo sanity check
        run: |
          test -f Gemfile
          test -f package.json
          test -d .github/workflows
