# Dependabot configuration
# - Only security updates (version updates disabled via open-pull-requests-limit: 0)
# - Security updates grouped into one PR per ecosystem across all listed directories
# - 3-day minimum release age for new versions (so they can't be unpublished in NPM)
# - Labels: "dependencies" (default), language-specific (javascript/ruby/github-actions), "ready-for-hosted-ci"
#
# Note: Root pnpm workspace (/) covers packages/react-on-rails, etc.
# Dummy apps have separate lock files and are listed explicitly.
# Keep every directory inside these grouped entries: a separate entry (or a
# multi-ecosystem group) opens one PR per dependency instead of one grouped PR.

version: 2

updates:
  # NPM/PNPM packages - root workspace and dummy apps
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/benchmarks/rspack-vite-dx"
      - "/benchmarks/rspack-vite-rails-dx"
      - "/benchmarks/rspack-vite-rails-dx/starters/rspack"
      - "/benchmarks/rspack-vite-rails-dx/starters/vite"
      - "/react_on_rails/spec/dummy"
      - "/react_on_rails_pro/spec/dummy"
      - "/react_on_rails_pro/spec/execjs-compatible-dummy"
      - "/internal/agent-evals/pro-app-buildability"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "javascript"
      - "ready-for-hosted-ci"
    # Disable version update PRs - only security updates will be created
    open-pull-requests-limit: 0
    cooldown:
      default-days: 3
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  # Ruby gems - root tooling plus Open source and Pro gems (including dummy apps)
  - package-ecosystem: "bundler"
    directories:
      - "/"
      - "/react_on_rails"
      - "/react_on_rails/spec/dummy"
      - "/react_on_rails_pro"
      - "/react_on_rails_pro/spec/dummy"
      - "/react_on_rails_pro/spec/execjs-compatible-dummy"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ruby"
      - "ready-for-hosted-ci"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 3
    groups:
      bundler-security:
        applies-to: security-updates
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github-actions"
      - "ready-for-hosted-ci"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 3
    groups:
      actions-security:
        applies-to: security-updates
        patterns:
          - "*"
